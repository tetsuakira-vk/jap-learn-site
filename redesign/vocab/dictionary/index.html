<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Dictionary — Search Words by English, Romaji or Japanese | Japanese Unlocked</title>
<meta name="description" content="Free Japanese dictionary covering N5–N3 vocabulary. Search by English, romaji, or Japanese. Every word with audio, reading, and JLPT level.">
<link rel="stylesheet" href="../../style.css">
<style>

/* ── Search bar ── */
.dict-search-wrap {
  position: sticky; top: 52px; z-index: 20;
  background: var(--ground); border-bottom: 1.5px solid var(--rule);
  padding: 16px 0;
  margin-bottom: 0;
}
.dict-search-inner {
  display: flex; gap: 0; align-items: stretch;
  border: 1.5px solid var(--ink);
  max-width: 680px;
}
.dict-search-input {
  flex: 1; border: none; background: none;
  padding: 14px 18px; font-size: 18px;
  font-family: var(--serif); color: var(--ink);
  outline: none; min-width: 0;
}
.dict-search-input::placeholder { color: var(--mid); font-family: var(--sans); font-size: 15px; }
.dict-search-clear {
  background: none; border: none; border-left: 1.5px solid var(--rule);
  width: 48px; cursor: pointer; color: var(--mid); font-size: 18px;
  display: none; align-items: center; justify-content: center;
  transition: color 0.13s;
}
.dict-search-clear:hover { color: var(--ink); }
.dict-search-clear.visible { display: flex; }

/* ── Filters ── */
.dict-filters {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 12px 0 0;
}
.dict-filter-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); margin-right: 4px; }
.dfbtn {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 12px; border: 1.5px solid var(--rule); background: none;
  color: var(--mid); cursor: pointer; font-family: var(--sans); transition: all 0.13s;
}
.dfbtn:hover, .dfbtn.on { border-color: var(--ink); color: var(--ink); background: var(--faint); }
.dfbtn.n5.on  { border-color: #7a5a7a; color: #7a5a7a; }
.dfbtn.n4.on  { border-color: #5a7a5a; color: #5a7a5a; }
.dfbtn.n3.on  { border-color: #7a6a3a; color: #7a6a3a; }
[data-theme="dark"] .dfbtn.n5.on { border-color: #c47acf; color: #c47acf; }
[data-theme="dark"] .dfbtn.n4.on { border-color: #6abf6a; color: #6abf6a; }
[data-theme="dark"] .dfbtn.n3.on { border-color: #d4a550; color: #d4a550; }

/* ── Results count ── */
.dict-meta {
  font-size: 11px; color: var(--mid); padding: 12px 0 0;
  min-height: 28px;
}

/* ── Results grid ── */
.dict-results {
  display: grid; gap: 0;
  border: 1px solid var(--rule);
  margin-bottom: 32px;
}

/* ── Word card ── */
.word-card {
  display: grid;
  grid-template-columns: 80px 1fr 1fr auto;
  align-items: center; gap: 0;
  border-bottom: 1px solid var(--rule);
  padding: 0; cursor: pointer; transition: background 0.12s;
}
.word-card:last-child { border-bottom: none; }
.word-card:hover { background: var(--faint); }
.word-card.playing { background: var(--faint); }

.wc-jp {
  padding: 14px 18px;
  border-right: 1px solid var(--rule);
  font-family: var(--serif); font-size: 26px; font-weight: 700;
  color: var(--ink); line-height: 1; transition: color 0.12s;
  text-align: center;
}
.word-card:hover .wc-jp, .word-card.playing .wc-jp { color: var(--accent); }

.wc-read {
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 3px;
  border-right: 1px solid var(--rule);
}
.wc-kana { font-family: var(--serif); font-size: 14px; color: var(--ink); }
.wc-ro   { font-size: 11px; color: var(--mid); }

.wc-en {
  padding: 14px 16px;
  font-size: 13px; font-weight: 600; color: var(--ink);
}

.wc-meta {
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
}
.wc-pos {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 6px; border: 1px solid var(--rule); color: var(--mid); white-space: nowrap;
}
.wc-pos.verb { border-color: #5a8a5a; color: #5a8a5a; }
.wc-pos.adj  { border-color: #7a6a9a; color: #7a6a9a; }
.wc-pos.adv  { border-color: #8a6a4a; color: #8a6a4a; }
[data-theme="dark"] .wc-pos.verb { border-color: #6abf6a; color: #6abf6a; }
[data-theme="dark"] .wc-pos.adj  { border-color: #a08acf; color: #a08acf; }
[data-theme="dark"] .wc-pos.adv  { border-color: #c49a6a; color: #c49a6a; }
.wc-pos.expr { border-color: var(--accent); color: var(--accent); }
.wc-lv {
  font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
  padding: 2px 6px; white-space: nowrap;
}
.wc-lv.n5 { background: #7a5a7a; color: #fff; }
.wc-lv.n4 { background: #5a7a5a; color: #fff; }
.wc-lv.n3 { background: #7a6a3a; color: #fff; }

/* ── Empty / no results ── */
.dict-empty {
  padding: 48px 24px; text-align: center;
}
.dict-empty-jp {
  font-family: var(--serif); font-size: 48px; color: var(--rule);
  line-height: 1; margin-bottom: 16px;
}
.dict-empty-head { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.dict-empty-sub  { font-size: 13px; color: var(--mid); margin-bottom: 32px; }
.dict-examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.dict-ex-pill {
  font-size: 12px; padding: 6px 14px; border: 1.5px solid var(--rule);
  cursor: pointer; background: none; color: var(--ink); font-family: var(--sans);
  transition: all 0.13s;
}
.dict-ex-pill:hover { border-color: var(--ink); background: var(--faint); }
.dict-ex-pill .ex-jp { font-family: var(--serif); font-size: 14px; margin-right: 4px; }

.dict-no-results { padding: 32px 16px; text-align: center; color: var(--mid); font-size: 13px; }

/* ── Featured header ── */
.dict-featured-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--mid);
  padding: 14px 0 8px;
}

@media (max-width: 700px) {
  .word-card { grid-template-columns: 60px 1fr auto; }
  .wc-read   { display: none; }
  .word-card { padding: 0; }
  .wc-jp     { font-size: 20px; padding: 12px 12px; }
  .wc-en     { padding: 12px 12px; }
  .wc-meta   { padding: 12px 10px; }
}
</style>

/* ─────────────────────────────────────────────
   SEARCH & RENDER
───────────────────────────────────────────── */
var searchEl  = document.getElementById('dict-search');
var clearBtn  = document.getElementById('dict-clear');
var outputEl  = document.getElementById('dict-output');
var metaEl    = document.getElementById('dict-meta');

// Update word count in page meta
document.getElementById('word-count-meta').textContent = DICT.length + ' words';

var activeLevels = [];
var activePOS    = '';
var searchVal    = '';

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text.split('・')[0]);
  u.lang = 'ja-JP'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function posClass(pos) { return pos; }

function buildCard(row) {
  var w = row[0], r = row[1], ro = row[2], en = row[3], pos = row[4], n = row[5];
  return '<div class="word-card" data-speak="' + w + '">' +
    '<div class="wc-jp">' + w + '</div>' +
    '<div class="wc-read"><span class="wc-kana">' + r + '</span><span class="wc-ro">' + ro + '</span></div>' +
    '<div class="wc-en">' + en + '</div>' +
    '<div class="wc-meta">' +
      '<span class="wc-pos ' + posClass(pos) + '">' + pos + '</span>' +
      '<span class="wc-lv n' + n + '">N' + n + '</span>' +
    '</div>' +
  '</div>';
}

function render() {
  var q = searchVal.trim();
  var qLow = q.toLowerCase();

  var results;
  if (!q && activeLevels.length === 0 && !activePOS) {
    /* Empty state */
    outputEl.innerHTML = buildEmptyState();
    metaEl.textContent = '';
    return;
  }

  results = DICT.filter(function (row) {
    var w = row[0], r = row[1], ro = row[2], en = row[3], pos = row[4], n = row[5];
    var lvMatch  = activeLevels.length === 0 || activeLevels.indexOf(n) > -1;
    var posMatch = !activePOS || pos === activePOS;
    var qMatch   = !q ||
      w.includes(q) || r.includes(q) ||
      ro.toLowerCase().includes(qLow) ||
      en.toLowerCase().includes(qLow);
    return lvMatch && posMatch && qMatch;
  });

  /* Sort: exact starts-with matches first */
  if (q) {
    results.sort(function (a, b) {
      var aExact = a[0] === q || a[1] === q ? 0 : (a[0].startsWith(q) || a[1].startsWith(q) ? 1 : 2);
      var bExact = b[0] === q || b[1] === q ? 0 : (b[0].startsWith(q) || b[1].startsWith(q) ? 1 : 2);
      return aExact - bExact;
    });
  }

  if (results.length === 0) {
    outputEl.innerHTML = '<div class="dict-no-results">No words found for "' + q + '" — try romaji, kanji, or English.</div>';
    metaEl.textContent = '0 results';
    return;
  }

  var max = 120;
  var shown = results.slice(0, max);
  var html = '<div class="dict-results">' + shown.map(buildCard).join('') + '</div>';
  if (results.length > max) {
    html += '<div class="dict-meta" style="text-align:center;padding-bottom:16px">Showing ' + max + ' of ' + results.length + ' — refine your search to narrow down.</div>';
  }
  outputEl.innerHTML = html;

  var label = results.length === 1 ? '1 result' : results.length + ' results';
  if (results.length > max) label += ' (showing ' + max + ')';
  metaEl.textContent = label;
}

var EXAMPLES = [
  ['食べる','taberu'],['可愛い','kawaii'],['勉強','benkyō'],
  ['友達','tomodachi'],['仕事','shigoto'],['travel',''],
  ['感情',''],['気持ち',''],
];

function buildEmptyState() {
  var pills = EXAMPLES.map(function (ex) {
    var label = ex[1] ? '<span class="ex-jp">' + ex[0] + '</span>' + ex[1] : ex[0];
    return '<button class="dict-ex-pill" data-fill="' + ex[0] + '">' + label + '</button>';
  }).join('');
  return '<div class="dict-empty">' +
    '<div class="dict-empty-jp">辞書</div>' +
    '<div class="dict-empty-head">Search ' + DICT.length + ' words</div>' +
    '<div class="dict-empty-sub">Type in English, romaji, or Japanese (kanji or kana). Click any word to hear it.</div>' +
    '<div class="dict-examples">' + pills + '</div>' +
  '</div>';
}

/* ── Events ── */
searchEl.addEventListener('input', function () {
  searchVal = this.value;
  clearBtn.classList.toggle('visible', searchVal.length > 0);
  render();
});

clearBtn.addEventListener('click', function () {
  searchEl.value = '';
  searchVal = '';
  clearBtn.classList.remove('visible');
  searchEl.focus();
  render();
});

document.addEventListener('click', function (e) {
  /* Example pills */
  var pill = e.target.closest('.dict-ex-pill');
  if (pill) {
    var fill = pill.dataset.fill;
    searchEl.value = fill;
    searchVal = fill;
    clearBtn.classList.add('visible');
    render();
    searchEl.focus();
    return;
  }

  /* Word card audio */
  var card = e.target.closest('.word-card[data-speak]');
  if (card) {
    speak(card.dataset.speak);
    card.classList.add('playing');
    setTimeout(function () { card.classList.remove('playing'); }, 1200);
    return;
  }
});

/* ── Level filter buttons ── */
document.querySelectorAll('.dfbtn[data-lv]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var lv = parseInt(this.dataset.lv, 10);
    var idx = activeLevels.indexOf(lv);
    if (idx > -1) {
      activeLevels.splice(idx, 1);
      this.classList.remove('on');
    } else {
      activeLevels.push(lv);
      this.classList.add('on');
    }
    render();
  });
});

/* ── POS filter buttons ── */
document.querySelectorAll('.dfbtn[data-pos]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var p = this.dataset.pos;
    if (activePOS === p) {
      activePOS = '';
      this.classList.remove('on');
    } else {
      activePOS = p;
      document.querySelectorAll('.dfbtn[data-pos]').forEach(function (b) { b.classList.remove('on'); });
      this.classList.add('on');
    }
    render();
  });
});

/* ── Initial render ── */
render();

})();
