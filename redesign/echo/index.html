<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo 影 — Immersive Conversation Practice | Japanese Unlocked</title>
<meta name="description" content="Step into real Japanese situations — ordering food, shopping, meeting people. Narrator sets the scene, character speaks Japanese, you get a cue and a gap to speak aloud, then hear the answer twice — once at speed, once slow to shadow.">
<link rel="stylesheet" href="../style.css">
<style>
  /* ── Echo colour tokens — dark-first, light and warm override ── */
  :root {
    --e-bg:     #1d1e20;
    --e-entry:  #2e2e33;
    --e-border: #333335;
    --e-ink:    #dadadb;
    --e-mid:    #9b9c9d;
    --e-faint:  #252527;
    --e-blue:   #4a9eca;
    --e-red:    #c0392b;
  }
  [data-theme="light"] {
    --e-bg:#fafaf8; --e-entry:#ebebea; --e-border:#d4d4d0;
    --e-ink:#1a1a18; --e-mid:#787874; --e-faint:#f2f2f0;
    --e-blue:#2a7aaa; --e-red:#c0392b;
  }
  [data-theme="warm"] {
    --e-bg:#f0ebe2; --e-entry:#dfd9cf; --e-border:#ccc6bc;
    --e-ink:#2a2420; --e-mid:#7a7068; --e-faint:#e8e2d8;
    --e-blue:#3a7aaa; --e-red:#c0392b;
  }

  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; min-height: 100%;
    background: var(--e-bg); color: var(--e-ink);
    font-family: var(--sans);
  }

  .echo-rule { height: 3px; background: var(--e-red); flex-shrink: 0; }

  /* ── Three-column layout ── */
  .echo-layout {
    display: flex; flex: 1;
    overflow: hidden; min-height: 0;
  }

  /* ── Left: scene browser ── */
  .echo-sidebar {
    width: 220px; flex-shrink: 0;
    border-right: 1px solid var(--e-border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .esb-head {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--e-border); flex-shrink: 0;
  }
  .esb-label {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--e-mid); margin-bottom: 9px;
  }
  .esb-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .esb-tab {
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border: 1px solid var(--e-border);
    background: none; color: var(--e-mid); cursor: pointer;
    transition: border-color .1s, color .1s;
  }
  .esb-tab:hover { border-color: var(--e-ink); color: var(--e-ink); }
  .esb-tab.on { border-color: var(--e-red); color: var(--e-red); }

  .esb-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .esb-list::-webkit-scrollbar { width: 3px; }
  .esb-list::-webkit-scrollbar-thumb { background: var(--e-border); }

  .esb-item {
    padding: 9px 14px; cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .1s, border-color .1s;
  }
  .esb-item:hover { background: var(--e-faint); }
  .esb-item.on { background: var(--e-faint); border-left-color: var(--e-red); }
  .esb-name { font-size: 12px; font-weight: 600; color: var(--e-ink); line-height: 1.3; }
  .esb-meta { font-size: 10px; color: var(--e-mid); margin-top: 2px; }

  /* ── Centre: audio player panel ── */
  .echo-player-panel {
    width: 320px; flex-shrink: 0;
    border-right: 1px solid var(--e-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 22px 40px; gap: 18px;
    overflow-y: auto;
  }
  .echo-player-panel::-webkit-scrollbar { width: 3px; }
  .echo-player-panel::-webkit-scrollbar-thumb { background: var(--e-border); }

  .epp-empty {
    text-align: center; color: var(--e-mid);
  }
  .epp-empty-jp {
    font-family: var(--serif); font-size: 4rem;
    opacity: .12; line-height: 1; margin-bottom: 14px;
  }
  .epp-empty-text { font-size: 12px; line-height: 1.7; }

  .epp-title {
    font-size: 15px; font-weight: 700;
    text-align: center; color: var(--e-ink); line-height: 1.4;
  }
  .epp-badge {
    display: inline-block;
    background: rgba(192,57,43,.12); color: #e05a4a;
    font-size: 10px; font-weight: 700; letter-spacing: .07em;
    padding: 3px 10px; border: 1px solid rgba(192,57,43,.25);
    text-transform: uppercase;
  }
  .epp-meta {
    font-size: 11px; color: var(--e-mid); text-align: center; line-height: 1.65;
  }
  .epp-how {
    background: var(--e-entry); border: 1px solid var(--e-border);
    padding: 12px 14px; font-size: 11px; color: var(--e-mid);
    line-height: 1.65; width: 100%;
  }
  .epp-how strong { color: var(--e-ink); }

  /* Seek bar */
  .epp-seek-wrap { width: 100%; }
  .epp-seek {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px;
    outline: none; cursor: pointer;
    background: var(--e-border);
  }
  .epp-seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px;
    border-radius: 50%; background: var(--e-blue); cursor: pointer;
  }
  .epp-seek::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--e-blue); cursor: pointer; border: none;
  }
  .epp-time {
    width: 100%; display: flex; justify-content: space-between;
    font-size: 10px; color: var(--e-mid); margin-top: 5px;
  }

  /* Play button */
  .epp-play {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--e-blue); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
    -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  .epp-play:hover { background: #5aaede; }
  .epp-play:active { transform: scale(.95); }
  .epp-play svg { fill: #fff; }
  .epp-play .icon-pause { display: none; }
  .epp-play.playing .icon-play  { display: none; }
  .epp-play.playing .icon-pause { display: block; }

  /* Download */
  .epp-download {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px;
    border: 1px solid var(--e-border);
    color: var(--e-mid); text-decoration: none;
    font-size: 11px; transition: border-color .15s, color .15s;
  }
  .epp-download:hover { border-color: var(--e-ink); color: var(--e-ink); }

  /* ── Right: transcript ── */
  .echo-transcript {
    flex: 1; overflow-y: auto;
    padding: 22px 26px 40px;
  }
  .echo-transcript::-webkit-scrollbar { width: 3px; }
  .echo-transcript::-webkit-scrollbar-thumb { background: var(--e-border); }

  .et-heading {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: #404042; margin-bottom: 14px;
  }
  .et-intro {
    font-size: 11px; color: var(--e-mid); font-style: italic;
    line-height: 1.75; padding-bottom: 14px; margin-bottom: 6px;
    border-bottom: 1px solid var(--e-border);
  }

  .beat-block {
    padding: 10px 11px; border-radius: 7px;
    margin-bottom: 2px; opacity: .22;
    transition: opacity .3s, background .3s;
  }
  .beat-block.active { opacity: 1; background: var(--e-entry); }

  .t-line { font-size: 11px; line-height: 1.65; margin-bottom: 4px; }
  .t-line:last-child { margin-bottom: 0; }
  .t-narrator { color: #505050; font-style: italic; }
  .t-cue      { color: #3a6a8a; }
  .t-char-line, .t-ans-line {
    display: flex; align-items: baseline; gap: 8px;
  }
  .t-speaker {
    font-size: 10px; color: var(--e-mid);
    min-width: 44px; flex-shrink: 0; opacity: .55;
  }
  .t-jp {
    font-family: var(--serif); font-size: 15px;
    color: var(--e-ink); line-height: 1.5;
  }
  .t-ans-line .t-jp { color: var(--e-blue); }
  .t-romaji {
    font-size: 10px; color: var(--e-mid); opacity: .45; margin-left: 4px;
  }

  /* Key phrases below transcript */
  .et-kp-section {
    margin-top: 28px; border-top: 1px solid var(--e-border); padding-top: 20px;
  }
  .et-kp-label {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: #404042; margin-bottom: 14px;
  }
  .et-kp-card {
    background: var(--e-entry); border: 1px solid var(--e-border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 10px;
  }
  .et-kp-jp      { font-family: var(--serif); font-size: 1.1rem; color: var(--e-ink); margin-bottom: 3px; }
  .et-kp-reading { font-size: 11px; color: var(--e-mid); font-style: italic; margin-bottom: 5px; }
  .et-kp-meaning { font-size: 12px; color: var(--e-blue); font-weight: 700; margin-bottom: 8px; }
  .et-kp-note    { font-size: 11px; color: var(--e-mid); line-height: 1.7; }

  /* No-audio state */
  .et-no-audio {
    padding: 40px 0; text-align: center; color: var(--e-mid);
    font-size: 12px; line-height: 1.8;
  }
  .et-no-audio code {
    display: inline-block; background: var(--e-entry); color: var(--e-ink);
    font-size: 11px; padding: 2px 7px; margin: 4px 0;
  }

  audio { display: none; }

  /* ── Mobile ── */
  @media (max-width: 820px) {
    .echo-player-panel { width: 260px; }
  }
  @media (max-width: 600px) {
    .echo-layout { flex-direction: column; overflow: visible; }
    .echo-sidebar { width: 100%; max-height: 160px; border-right: none; border-bottom: 1px solid var(--e-border); }
    .echo-player-panel { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--e-border); justify-content: flex-start; padding: 14px; gap: 10px; min-height: auto; }
    .epp-how { display: none; }
    .echo-transcript { padding: 16px; }
  }
</style>
</head>
<body>
<div id="ju-nav"></div>
<div class="echo-rule"></div>

<div class="echo-layout">

  <!-- Left: scene browser -->
  <aside class="echo-sidebar">
    <div class="esb-head">
      <div class="esb-label">Echo 影</div>
      <div class="esb-tabs" id="esb-tabs"></div>
    </div>
    <div class="esb-list" id="esb-list">
      <div style="padding:16px 14px;font-size:11px;color:var(--e-mid)">Loading…</div>
    </div>
  </aside>

  <!-- Centre: player -->
  <div class="echo-player-panel" id="epp">
    <div class="epp-empty">
      <div class="epp-empty-jp">影</div>
      <div class="epp-empty-text">Choose a scene<br>from the list.</div>
    </div>
  </div>

  <!-- Right: transcript -->
  <div class="echo-transcript" id="et">
    <div style="color:var(--e-mid);font-size:12px;padding-top:40px;text-align:center">
      Select a scene to begin.
    </div>
  </div>

</div>

<audio id="echo-audio" preload="metadata"></audio>
<script src="../nav.js"></script>
<script>
/* ─── Groups ─── */
const GROUPS = {
  food:     ['food_and_drink'],
  social:   ['social'],
  shopping: ['shopping'],
  around:   ['transport','navigation'],
  culture:  ['culture','everyday_life','health','entertainment','travel'],
};
const GROUP_LABELS = {
  food:'Food', social:'Social', shopping:'Shopping',
  around:'Getting Around', culture:'Culture & Life',
};
function groupOf(t) {
  for (const [k,v] of Object.entries(GROUPS)) if (v.includes(t)) return k;
  return 'culture';
}
function titleCase(s) { return s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function firstName(s) { return (s||'Character').split(',')[0].trim(); }
function fmt(s) { var m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

/* ─── Audio element ─── */
const audio = document.getElementById('echo-audio');
let allBeats = [], activeBeatIdx = -1, isSeeking = false;

function updateSeek(pct) {
  const s = document.getElementById('epp-seek');
  if (!s) return;
  s.style.background = `linear-gradient(to right, var(--e-blue) ${pct}%, var(--e-border) ${pct}%)`;
}

audio.addEventListener('play',           () => { const b=document.getElementById('epp-play'); if(b) b.classList.add('playing'); });
audio.addEventListener('pause',          () => { const b=document.getElementById('epp-play'); if(b) b.classList.remove('playing'); });
audio.addEventListener('ended',          () => { const b=document.getElementById('epp-play'); if(b) b.classList.remove('playing'); });
audio.addEventListener('loadedmetadata', () => { const t=document.getElementById('epp-total'); if(t) t.textContent=fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!audio.duration || isSeeking) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  const s = document.getElementById('epp-seek');
  if (s) { s.value = pct; updateSeek(pct); }
  const cur = document.getElementById('epp-current');
  if (cur) cur.textContent = fmt(audio.currentTime);
  syncTranscript(audio.currentTime * 1000);
});

function syncTranscript(ms) {
  if (!allBeats.length) return;
  let idx = -1;
  for (let i = 0; i < allBeats.length; i++) {
    if (ms >= allBeats[i].start_ms) idx = i; else break;
  }
  if (idx === activeBeatIdx) return;
  activeBeatIdx = idx;
  document.querySelectorAll('.beat-block').forEach((el,i) => el.classList.toggle('active', i===idx));
  if (idx >= 0) {
    const el = document.querySelector(`.beat-block[data-idx="${idx}"]`);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

function togglePlay() { audio.paused ? audio.play() : audio.pause(); }

/* ─── State ─── */
let scenes = [], activeId = null;

/* ─── Sidebar ─── */
function buildTabs() {
  const el = document.getElementById('esb-tabs');
  el.innerHTML = `<button class="esb-tab on" data-g="">All</button>` +
    Object.entries(GROUP_LABELS).map(([k,v])=>
      `<button class="esb-tab" data-g="${k}">${v}</button>`
    ).join('');
  el.addEventListener('click', e => {
    const b = e.target.closest('.esb-tab'); if (!b) return;
    el.querySelectorAll('.esb-tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    buildList(b.dataset.g);
  });
}

function buildList(filter) {
  const el   = document.getElementById('esb-list');
  const list = filter ? scenes.filter(s=>groupOf(s.topic)===filter) : scenes;
  if (!list.length) {
    el.innerHTML = '<div style="padding:14px;font-size:11px;color:var(--e-mid)">None.</div>';
    return;
  }
  el.innerHTML = list.map(s => {
    const on = s.scene_id === activeId ? ' on' : '';
    const mins = s.duration_seconds ? Math.round(s.duration_seconds/60) : '—';
    return `<div class="esb-item${on}" data-id="${s.scene_id}">
      <div class="esb-name">${s.title || titleCase(s.scene_id)}</div>
      <div class="esb-meta">${s.beat_count||'?'} beats · ~${mins} min</div>
    </div>`;
  }).join('');
  el.addEventListener('click', e => {
    const item = e.target.closest('.esb-item'); if (!item) return;
    const s = scenes.find(x => x.scene_id === item.dataset.id);
    if (s) loadScene(s);
  });
}

/* ─── Load scene ─── */
function loadScene(s) {
  audio.pause();
  activeId = s.scene_id;
  activeBeatIdx = -1;
  allBeats = s.beats || [];

  document.querySelectorAll('.esb-item').forEach(el =>
    el.classList.toggle('on', el.dataset.id === s.scene_id)
  );

  const hasAudio = !!s.audio_url;
  renderPlayer(s, hasAudio);
  renderTranscript(s, hasAudio);

  if (hasAudio) {
    audio.src = s.audio_url;
    audio.load();
    const dl = document.getElementById('epp-dl');
    if (dl) { dl.href = s.audio_url; dl.download = `echo-${s.scene_id}.mp3`; }

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.title || titleCase(s.scene_id),
        artist: 'Japanese Unlocked — Echo',
        album: `${s.beat_count} beats`,
      });
    }
  }
}

/* ─── Player panel ─── */
function renderPlayer(s, hasAudio) {
  const el = document.getElementById('epp');
  const mins = s.duration_seconds ? Math.round(s.duration_seconds/60) : '—';
  const badge = [s.level||'N5', (s.topic||'').replace(/_/g,' ')].filter(Boolean).join(' · ');

  if (!hasAudio) {
    el.innerHTML = `
      <div class="epp-title">${s.title||titleCase(s.scene_id)}</div>
      <div class="epp-badge">${badge}</div>
      <div class="epp-meta">${s.beat_count||'?'} exchanges</div>
      <div class="epp-how">
        <strong>Audio not generated yet.</strong><br>
        Run the generation script to create the audio for this scene:<br>
        <code style="font-size:10px;display:block;margin-top:6px">python tools/walk/generate_echo.py</code>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="epp-title">${s.title||titleCase(s.scene_id)}</div>
    <div class="epp-badge">${badge}</div>
    <div class="epp-meta">${s.beat_count||'?'} beats · ~${mins} min · pocket your phone and press play</div>
    <div class="epp-how">
      <strong>How it works:</strong> The narrator sets the scene. The character speaks Japanese. You get a cue and a gap to speak aloud — then hear the correct phrase twice: once at speed, once slow to shadow.
    </div>
    <div class="epp-seek-wrap">
      <input type="range" id="epp-seek" class="epp-seek" min="0" max="100" step="0.1" value="0">
      <div class="epp-time">
        <span id="epp-current">0:00</span>
        <span id="epp-total">—</span>
      </div>
    </div>
    <button class="epp-play" id="epp-play" onclick="togglePlay()">
      <svg class="icon-play"  width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" width="30" height="30" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <a id="epp-dl" class="epp-download" download>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Download for offline
    </a>`;

  updateSeek(0);

  const seekEl = document.getElementById('epp-seek');
  seekEl.addEventListener('mousedown',  () => isSeeking = true);
  seekEl.addEventListener('touchstart', () => isSeeking = true, {passive:true});
  seekEl.addEventListener('mouseup',    () => isSeeking = false);
  seekEl.addEventListener('touchend',   () => isSeeking = false);
  seekEl.addEventListener('input', () => {
    if (audio.duration) audio.currentTime = (seekEl.value/100) * audio.duration;
    updateSeek(parseFloat(seekEl.value));
  });
}

/* ─── Transcript ─── */
function renderTranscript(s, hasAudio) {
  const el    = document.getElementById('et');
  const name  = firstName(s.other_character);
  const beats = s.beats || [];

  const beatsHtml = beats.map((b,i) => {
    const charLine = b.character_japanese
      ? `<div class="t-line t-char-line">
           <span class="t-speaker">${name}</span>
           <span class="t-jp">${b.character_japanese}</span>
         </div>` : '';
    return `<div class="beat-block" data-idx="${i}">
      ${b.context_line ? `<div class="t-line t-narrator">${b.context_line}</div>` : ''}
      ${charLine}
      <div class="t-line t-cue">${b.english_cue}</div>
      <div class="t-line t-ans-line">
        <span class="t-speaker">You</span>
        <span class="t-jp">${b.japanese_answer}</span>
        ${b.romaji ? `<span class="t-romaji">${b.romaji}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  const noAudioNote = !hasAudio
    ? `<div class="et-no-audio">
        Audio not yet generated for this scene.<br>
        Run: <code>python tools/walk/generate_echo.py</code><br>
        or <code>python tools/walk/generate_echo.py --scene ${s.scene_id}</code>
      </div>` : '';

  const kpHtml = (s.key_phrases||[]).map(p=>`
    <div class="et-kp-card">
      <div class="et-kp-jp">${p.phrase}</div>
      <div class="et-kp-reading">${p.reading}</div>
      <div class="et-kp-meaning">${p.meaning}</div>
      <div class="et-kp-note">${p.note}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="et-heading">Transcript</div>
    <div class="et-intro">${s.scene_intro||''}</div>
    ${beatsHtml}
    ${noAudioNote}
    ${kpHtml ? `<div class="et-kp-section"><div class="et-kp-label">Key Phrases</div>${kpHtml}</div>` : ''}`;
}

/* ─── Boot ─── */
fetch('/echo/scenes.json')
  .then(r => { if (!r.ok) throw new Error('no scenes.json'); return r.json(); })
  .then(data => {
    scenes = data;
    buildTabs();
    buildList('');
    // Auto-select first scene
    if (scenes.length) loadScene(scenes[0]);
  })
  .catch(() => {
    // scenes.json not generated yet — fall back to scenarios.json (no audio)
    fetch('/echo/scenarios.json')
      .then(r => r.json())
      .then(data => {
        scenes = data.map(s => ({
          ...s,
          title: titleCase(s.scene_id),
          beat_count: (s.beats||[]).length,
          duration_seconds: null,
          audio_url: null,
        }));
        buildTabs();
        buildList('');
        if (scenes.length) loadScene(scenes[0]);
      });
  });
</script>
</body>
</html>
