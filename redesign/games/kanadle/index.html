<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANADLE — Daily Japanese Kana Wordle | Japanese Unlocked</title>
<meta name="description" content="Guess the 5-kana Japanese word in 6 tries. A new word every day. Free daily Japanese word game — hiragana Wordle.">
<link rel="stylesheet" href="../../style.css">
<style>
/* ── Layout ─────────────────────────────────────────────────── */
.game-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 16px 12px 48px;
  max-width: 520px;
  margin: 0 auto;
}

/* ── Header ─────────────────────────────────────────────────── */
.game-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 12px;
}
.game-title {
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: .04em;
}
.game-title-jp {
  font-size: .75rem;
  color: var(--mid);
  font-weight: 400;
  display: block;
  letter-spacing: .06em;
}
.game-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.game-day {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--mid);
}
.streak-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border: 1.5px solid var(--ink);
  color: var(--ink);
  letter-spacing: .04em;
}
.streak-badge.active { background: var(--ink); color: var(--ground); }

/* ── Toast ──────────────────────────────────────────────────── */
.toast {
  position: fixed;
  top: 72px;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  background: var(--ink);
  color: var(--ground);
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 200;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Tile grid ──────────────────────────────────────────────── */
.grid {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.grid-row {
  display: flex;
  gap: 5px;
}
.tile {
  width: 58px;
  height: 58px;
  border: 2px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 700;
  user-select: none;
  transition: border-color .1s;
  position: relative;
}
.tile.filled { border-color: var(--mid); }
.tile.correct  { background: #538d4e; color: #fff; border-color: #538d4e; }
.tile.present  { background: #b59f3b; color: #fff; border-color: #b59f3b; }
.tile.absent   { background: #3a3a3c; color: #fff; border-color: #3a3a3c; }
[data-theme="light"] .tile.absent { background: #787c7e; border-color: #787c7e; }
[data-theme="warm"]  .tile.absent { background: #8d8375; border-color: #8d8375; }

.tile.pop { animation: pop .1s ease; }
@keyframes pop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.tile.shake { animation: shake .4s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-6px); }
  40%     { transform: translateX(6px); }
  60%     { transform: translateX(-4px); }
  80%     { transform: translateX(4px); }
}
.tile.flip {
  animation: flipTile .5s ease forwards;
}
@keyframes flipTile {
  0%   { transform: scaleY(1); }
  45%  { transform: scaleY(0); }
  55%  { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}

/* ── Keyboard ───────────────────────────────────────────────── */
.kboard {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.kboard-row {
  display: flex;
  gap: 3px;
  justify-content: center;
}
.kkey {
  height: 42px;
  min-width: 32px;
  flex: 1;
  max-width: 44px;
  border: 1.5px solid var(--rule);
  background: var(--faint);
  color: var(--ink);
  font-family: var(--serif);
  font-size: .95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s, border-color .12s, color .12s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.kkey:active { opacity: .7; }
.kkey.wide { min-width: 56px; max-width: 72px; font-size: .75rem; font-family: var(--sans); font-weight: 700; letter-spacing: .03em; }
.kkey.correct  { background: #538d4e; color: #fff; border-color: #538d4e; }
.kkey.present  { background: #b59f3b; color: #fff; border-color: #b59f3b; }
.kkey.absent   { background: #3a3a3c; color: #636363; border-color: #3a3a3c; }
[data-theme="light"] .kkey.absent { background: #d3d6da; color: #888; border-color: #d3d6da; }
[data-theme="warm"]  .kkey.absent { background: #cbc5bb; color: #888; border-color: #cbc5bb; }

/* ── Result panel ───────────────────────────────────────────── */
.result-panel {
  display: none;
  width: 100%;
  border: 1.5px solid var(--ink);
  text-align: center;
}
.result-panel.show { display: block; }
.rp-top {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--faint);
}
.rp-outcome {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 8px;
}
.rp-word {
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 4px;
}
.rp-meaning {
  font-size: 14px;
  color: var(--mid);
}
.rp-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--rule);
}
.rps { padding: 16px 12px; border-right: 1px solid var(--rule); }
.rps:last-child { border-right: none; }
.rps-num { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; line-height: 1; margin-bottom: 3px; }
.rps-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--mid); }
.rp-actions {
  padding: 16px 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.rp-next {
  font-size: 12px;
  color: var(--mid);
  padding: 12px 20px 0;
}

@media (max-width: 380px) {
  .tile { width: 50px; height: 50px; font-size: 1.3rem; }
  .kkey { height: 38px; font-size: .85rem; }
}
</style>
</head>
<body>
<div id="ju-nav"></div>

<div class="toast" id="toast"></div>

<div class="game-wrap">

  <div class="game-header">
    <div>
      <div class="game-title">KANADLE <span class="game-title-jp">かなどる</span></div>
    </div>
    <div class="game-meta">
      <div class="game-day" id="game-day">Day —</div>
      <div class="streak-badge" id="streak-badge">🔥 0 streak</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="result-panel" id="result-panel">
    <div class="rp-top">
      <div class="rp-outcome" id="rp-outcome"></div>
      <div class="rp-word" id="rp-word"></div>
      <div class="rp-meaning" id="rp-meaning"></div>
    </div>
    <div class="rp-stats">
      <div class="rps"><div class="rps-num" id="stat-played">0</div><div class="rps-label">Played</div></div>
      <div class="rps"><div class="rps-num" id="stat-streak">0</div><div class="rps-label">Streak</div></div>
      <div class="rps"><div class="rps-num" id="stat-best">0</div><div class="rps-label">Best</div></div>
    </div>
    <div class="rp-next" id="rp-next"></div>
    <div class="rp-actions">
      <button class="btn btn-solid" id="share-btn" onclick="shareResult()">Share result</button>
    </div>
  </div>

  <div class="kboard" id="kboard"></div>

</div>

<div id="ju-footer"></div>
<script src="../../nav.js"></script>
<script>
// ── Word list [hiragana, english, romaji] ──────────────────────────────────
// Each entry is exactly 5 hiragana characters (including small kana like ょ っ)
const WORDS = [
  ['ありがとう','thank you','arigatou'],
  ['さようなら','goodbye','sayounara'],
  ['おめでとう','congratulations','omedetou'],
  ['すみません','excuse me','sumimasen'],
  ['こんにちは','hello','konnichiwa'],
  ['おかあさん','mother','okaasan'],
  ['おとうさん','father','otousan'],
  ['おにいさん','older brother','oniisan'],
  ['おねえさん','older sister','oneesan'],
  ['おじいさん','grandfather','ojiisan'],
  ['おばあさん','grandmother','obaasan'],
  ['むずかしい','difficult','muzukashii'],
  ['おもしろい','interesting','omoshiroi'],
  ['いそがしい','busy','isogashii'],
  ['すばらしい','wonderful','subarashii'],
  ['なつかしい','nostalgic','natsukashii'],
  ['かわいそう','poor thing','kawaisou'],
  ['なつやすみ','summer vacation','natsuyasumi'],
  ['ふゆやすみ','winter vacation','fuyuyasumi'],
  ['えいがかん','cinema','eigakan'],
  ['としょかん','library','toshokan'],
  ['びょういん','hospital','byouin'],
  ['あさごはん','breakfast','asagohan'],
  ['ひるごはん','lunch','hirugohan'],
  ['ばんごはん','dinner','bangohan'],
  ['こいのぼり','carp streamer','koinobori'],
  ['やまのぼり','mountain climbing','yamanobori'],
  ['ひなまつり','Hinamatsuri festival','hinamatsuri'],
  ['はなやさん','flower shop','hanayasan'],
  ['ほんやさん','bookshop','honyasan'],
  ['さんぽみち','walking path','sanpomichi'],
  ['おてあらい','bathroom','otearai'],
  ['ようちえん','kindergarten','youchien'],
  ['はくちょう','swan','hakuchou'],
  ['びようしつ','beauty salon','biyoushitsu'],
  ['きもちいい','feels good','kimochiii'],
  ['がんばって','do your best','ganbatte'],
  ['きをつけて','be careful','ki wo tsukete'],
  ['たぬきそば','tanuki soba','tanukisoba'],
  ['おべんとう','bento box','obentou'],
  ['おみそしる','miso soup','omisoshiru'],
  ['じてんしゃ','bicycle','jitensha'],
  ['こうさてん','intersection','kousaten'],
  ['ていきけん','commuter pass','teikiken'],
  ['しゅうでん','last train','shuuden'],
  ['みずたまり','puddle','mizutamari'],
  ['ゆきだるま','snowman','yukidaruma'],
  ['もみじがり','autumn leaf viewing','momijigari'],
  ['にほんばれ','clear skies','nihonbare'],
  ['おちゃわん','rice bowl','ochawan'],
  ['たまごやき','tamagoyaki','tamagoyaki'],
  ['にぎりずし','nigiri sushi','nigirizushi'],
  ['まぜごはん','mixed rice','magegohan'],
  ['やきさかな','grilled fish','yakisakana'],
  ['いためもの','stir fry','itamemono'],
  ['かすていら','castella cake','kasutera'],
  ['すいかわり','watermelon splitting','suikawari'],
  ['はなみかい','flower viewing party','hanamikai'],
  ['ほうじちゃ','hojicha tea','houjicha'],
  ['やおやさん','greengrocer','yaoyasan'],
  ['いなかみち','country road','inakamichi'],
  ['にぎやかな','lively','nigiyakana'],
  ['たいせつな','precious','taisetsuna'],
  ['おたがいに','each other','otagaini'],
  ['かいものへ','shopping trip','kaimonoe'],
  ['きのうまで','until yesterday','kinomade'],
  ['やきにくを','yakiniku','yakinikuwo'],
  ['ふじさんの','Mt. Fuji','fujisanno'],
  ['さくらいろ','cherry blossom colour','sakurairo'],
  ['あおいそら','blue sky','aoosora'],
  ['しずかなよ','quiet evening','shizukanayo'],
  ['おはなしを','a story','ohanashiwo'],
  ['うごかない','doesn\'t move','ugokanai'],
  ['きこえない','can\'t hear','kikoenai'],
  ['みえません','can\'t see','miemasen'],
  ['はじめまし','beginning of...','hajimemashi'],
  ['あそんでる','is playing','asonnderu'],
  ['たべている','is eating','tabeteiru'],
  ['のんでいる','is drinking','nondeiru'],
  ['かいました','bought it','kaimashita'],
  ['いきました','went there','ikimashita'],
  ['みました','saw it','mimashita'],
  ['よみました','read it','yomimashita'],
  ['かきました','wrote it','kakimashita'],
  ['はなしました','talked','hanashimashita'],
  ['あそびます','will play','asobimasuzu'],
  ['うたいます','will sing','utaimasuzu'],
];

// Filter to only exactly-5-char words
const VALID_WORDS = WORDS.filter(([w]) => [...w].length === 5);

// ── Date-seeded word ──────────────────────────────────────────────────────
const EPOCH = new Date('2026-01-01T00:00:00+09:00');
function getDayNumber() {
  const now = new Date();
  const jst = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  jst.setHours(0, 0, 0, 0);
  return Math.floor((jst - EPOCH) / 86400000) + 1;
}
const DAY_NUM   = getDayNumber();
const WORD_DATA = VALID_WORDS[((DAY_NUM - 1) % VALID_WORDS.length)];
const ANSWER    = [...WORD_DATA[0]]; // array of 5 kana chars
const MEANING   = WORD_DATA[1];
const ROMAJI    = WORD_DATA[2];

// ── State ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'kanadle_v1';
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s.day === DAY_NUM) return s;
    }
  } catch(e) {}
  return {
    day: DAY_NUM,
    guesses: [],   // array of 5-char arrays
    grades:  [],   // array of result arrays
    status:  'playing', // 'playing' | 'won' | 'lost'
    streak:  0,
    best:    0,
    played:  0,
  };
}

function saveState() {
  try {
    // Preserve streak/best/played across days
    const prev = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    state.streak = state.streak ?? prev.streak ?? 0;
    state.best   = Math.max(state.best ?? 0, prev.best ?? 0, state.streak);
    state.played = state.played ?? prev.played ?? 0;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// Restore streaks from previous day
(function restoreProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const prev = JSON.parse(raw);
    if (prev.day !== DAY_NUM) {
      // New day — preserve cumulative stats
      state.streak = prev.status === 'won' ? (prev.streak || 0) : 0;
      state.best   = Math.max(state.streak, prev.best || 0);
      state.played = (prev.played || 0);
    }
  } catch(e) {}
})();

// ── Key state tracking ────────────────────────────────────────────────────
const keyStates = {}; // kana → 'correct'|'present'|'absent'
const RANK = { correct: 2, present: 1, absent: 0 };

function updateKeyStates(guess, result) {
  guess.forEach((kana, i) => {
    const curr  = result[i];
    const prev  = keyStates[kana];
    if (!prev || RANK[curr] > RANK[prev]) keyStates[kana] = curr;
  });
}

// ── Grading ───────────────────────────────────────────────────────────────
function gradeGuess(guess) {
  const result = new Array(5).fill('absent');
  const pool   = [...ANSWER];
  // Pass 1: correct positions
  for (let i = 0; i < 5; i++) {
    if (guess[i] === ANSWER[i]) { result[i] = 'correct'; pool[i] = null; }
  }
  // Pass 2: present in wrong position
  for (let i = 0; i < 5; i++) {
    if (result[i] === 'correct') continue;
    const j = pool.indexOf(guess[i]);
    if (j !== -1) { result[i] = 'present'; pool[j] = null; }
  }
  return result;
}

// ── Current guess buffer ──────────────────────────────────────────────────
let currentGuess = [];

// ── DOM builders ──────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.id = `row-${r}`;
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

const KB_ROWS = [
  ['あ','い','う','え','お','か','き','く','け','こ'],
  ['が','ぎ','ぐ','げ','ご','さ','し','す','せ','そ'],
  ['ざ','じ','ず','ぜ','ぞ','た','ち','つ','て','と'],
  ['だ','ぢ','づ','で','ど','な','に','ぬ','ね','の'],
  ['は','ひ','ふ','へ','ほ','ば','び','ぶ','べ','ぼ'],
  ['ぱ','ぴ','ぷ','ぺ','ぽ','ま','み','む','め','も'],
  ['や','ゆ','よ','ゃ','ゅ','ら','り','る','れ','ろ'],
  ['←','わ','を','ん','っ','ょ','ENTER'],
];

function buildKeyboard() {
  const kb = document.getElementById('kboard');
  kb.innerHTML = '';
  KB_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kboard-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'kkey' + (k === 'ENTER' || k === '←' ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.kana = k;
      if (k === 'ENTER') {
        btn.addEventListener('click', submitGuess);
      } else if (k === '←') {
        btn.addEventListener('click', deleteLast);
      } else {
        btn.addEventListener('click', () => addKana(k));
      }
      rowEl.appendChild(btn);
    });
    kb.appendChild(rowEl);
  });
}

// ── Input ─────────────────────────────────────────────────────────────────
function addKana(k) {
  if (state.status !== 'playing') return;
  if (currentGuess.length >= 5) return;
  currentGuess.push(k);
  const row = state.guesses.length;
  const col = currentGuess.length - 1;
  const tile = document.getElementById(`tile-${row}-${col}`);
  if (tile) {
    tile.textContent = k;
    tile.classList.add('filled');
    void tile.offsetWidth; // reflow
    tile.classList.add('pop');
    tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
  }
}

function deleteLast() {
  if (state.status !== 'playing') return;
  if (currentGuess.length === 0) return;
  const row = state.guesses.length;
  const col = currentGuess.length - 1;
  const tile = document.getElementById(`tile-${row}-${col}`);
  if (tile) { tile.textContent = ''; tile.classList.remove('filled'); }
  currentGuess.pop();
}

function submitGuess() {
  if (state.status !== 'playing') return;
  if (currentGuess.length < 5) {
    shakeRow(state.guesses.length);
    showToast('Not enough characters');
    return;
  }

  const guess  = [...currentGuess];
  const result = gradeGuess(guess);

  state.guesses.push(guess);
  state.grades.push(result);
  currentGuess = [];

  const rowIdx = state.guesses.length - 1;
  revealRow(rowIdx, guess, result, () => {
    updateKeyStates(guess, result);
    refreshKeyboard();

    const won  = result.every(r => r === 'correct');
    const lost = !won && state.guesses.length >= 6;

    if (won) {
      state.status = 'won';
      state.streak = (state.streak || 0) + 1;
      state.best   = Math.max(state.best || 0, state.streak);
      state.played = (state.played || 0) + 1;
      saveState();
      setTimeout(() => showResult(true), 400);
      const msgs = ['完璧！','すごい！','よくできました！','素晴らしい！'];
      showToast(msgs[Math.min(rowIdx, msgs.length - 1)]);
    } else if (lost) {
      state.status = 'lost';
      state.streak = 0;
      state.played = (state.played || 0) + 1;
      saveState();
      setTimeout(() => showResult(false), 400);
    } else {
      saveState();
    }
  });
}

// ── Row reveal animation ──────────────────────────────────────────────────
function revealRow(rowIdx, guess, result, onDone) {
  const DELAY = 300; // ms between tiles
  result.forEach((res, col) => {
    const tile = document.getElementById(`tile-${rowIdx}-${col}`);
    if (!tile) return;
    setTimeout(() => {
      tile.classList.add('flip');
      setTimeout(() => {
        tile.className = `tile ${res}`;
        tile.textContent = guess[col];
      }, 250); // apply colour at midpoint
    }, col * DELAY);
  });
  setTimeout(onDone, result.length * DELAY + 300);
}

function shakeRow(rowIdx) {
  for (let c = 0; c < 5; c++) {
    const tile = document.getElementById(`tile-${rowIdx}-${c}`);
    if (!tile) continue;
    tile.classList.remove('shake');
    void tile.offsetWidth;
    tile.classList.add('shake');
    tile.addEventListener('animationend', () => tile.classList.remove('shake'), { once: true });
  }
}

// ── Keyboard refresh ──────────────────────────────────────────────────────
function refreshKeyboard() {
  document.querySelectorAll('.kkey').forEach(btn => {
    const k = btn.dataset.kana;
    if (k && keyStates[k]) {
      btn.className = 'kkey ' + keyStates[k];
      if (k === 'ENTER' || k === '←') btn.classList.add('wide');
    }
  });
}

// ── Toast ─────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, duration = 1800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ── Result panel ──────────────────────────────────────────────────────────
function showResult(won) {
  const panel = document.getElementById('result-panel');
  document.getElementById('rp-outcome').textContent = won
    ? `Solved in ${state.guesses.length} ${state.guesses.length === 1 ? 'guess' : 'guesses'}`
    : 'Better luck tomorrow';
  document.getElementById('rp-word').textContent    = ANSWER.join('');
  document.getElementById('rp-meaning').textContent = `${MEANING} — ${ROMAJI}`;
  document.getElementById('stat-played').textContent = state.played;
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('stat-best').textContent   = state.best;

  // Next word countdown
  const jst  = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  const next  = new Date(jst); next.setDate(next.getDate() + 1); next.setHours(0, 0, 0, 0);
  const diff  = next - jst;
  const hh    = String(Math.floor(diff / 3600000)).padStart(2, '0');
  const mm    = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
  document.getElementById('rp-next').textContent = `Next word in ${hh}h ${mm}m`;

  panel.classList.add('show');
}

// ── Share ─────────────────────────────────────────────────────────────────
function shareResult() {
  const emoji = { correct: '🟩', present: '🟨', absent: '⬜' };
  const grid = state.grades.map(row => row.map(r => emoji[r]).join('')).join('\n');
  const won  = state.status === 'won';
  const text = `KANADLE — Day ${DAY_NUM}\n${won ? state.guesses.length : 'X'}/6\n\n${grid}\n\njapaneseunlocked.com/games/kanadle/`;
  navigator.clipboard.writeText(text)
    .then(() => showToast('Copied to clipboard!'))
    .catch(() => showToast('Copy manually:\n' + text));
}

// ── Restore previous guesses ──────────────────────────────────────────────
function restoreGuesses() {
  state.guesses.forEach((guess, rowIdx) => {
    const result = state.grades[rowIdx];
    guess.forEach((kana, col) => {
      const tile = document.getElementById(`tile-${rowIdx}-${col}`);
      if (tile) { tile.textContent = kana; tile.className = `tile ${result[col]}`; }
    });
    updateKeyStates(guess, result);
  });
  refreshKeyboard();
}

// ── Header ────────────────────────────────────────────────────────────────
function updateHeader() {
  document.getElementById('game-day').textContent = `Day ${DAY_NUM}`;
  const streak = state.streak || 0;
  const badge  = document.getElementById('streak-badge');
  badge.textContent = `🔥 ${streak} streak`;
  if (streak > 0) badge.classList.add('active');
}

// ── Keyboard handler ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter')     { submitGuess(); return; }
  if (e.key === 'Backspace') { deleteLast();  return; }
});

// ── Init ──────────────────────────────────────────────────────────────────
buildGrid();
buildKeyboard();
updateHeader();
restoreGuesses();

if (state.status !== 'playing') {
  setTimeout(() => showResult(state.status === 'won'), 200);
}
</script>
</body>
</html>
