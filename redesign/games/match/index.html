<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Japanese Uncovered</title>
<meta name="description" content="Flip cards to match kanji with their readings or meanings. Three grid sizes, two match types, best-time tracking. Train kanji recognition the fun way.">
<link rel="stylesheet" href="../../style.css">
<style>
.game-shell {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 0 60px;
}
.game-screen { display: none; }
.game-screen.active { display: block; }

/* ── Start ─────────────────────────────────────────────────── */
.start-wrap { padding: 32px 24px; }

.option-row {
  margin-bottom: 24px;
}
.option-label {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--mid);
  margin-bottom: 10px;
}
.option-chips {
  display: flex;
  border: 1.5px solid var(--ink);
}
.opt-chip {
  flex: 1;
  padding: 12px 16px;
  background: none;
  border: none;
  border-right: 1px solid var(--rule);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--mid);
  transition: background .12s, color .12s;
  text-align: center;
  line-height: 1.3;
}
.opt-chip:last-child { border-right: none; }
.opt-chip:hover { background: var(--faint); color: var(--ink); }
.opt-chip.active { background: var(--ink); color: var(--ground); }

.opt-chip .oc-main { font-family: var(--serif); font-size: 1.2rem; display: block; margin-bottom: 2px; }
.opt-chip .oc-sub  { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; display: block; }
.opt-chip .oc-desc { font-size: 11px; margin-top: 4px; display: block; font-weight: 400; opacity: .7; }

/* ── HUD ─────────────────────────────────────────────────── */
.game-hud {
  display: flex;
  gap: 8px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--rule);
  background: var(--faint);
  align-items: center;
  flex-wrap: wrap;
}
.hud-chip {
  padding: 6px 12px;
  border: 1px solid var(--rule);
  background: var(--ground);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--mid);
  font-variant-numeric: tabular-nums;
}
.hud-chip strong { color: var(--ink); }
.hud-timer {
  margin-left: auto;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

/* ── Progress bar ─────────────────────────────────────────── */
.match-progress-wrap {
  height: 5px;
  background: var(--faint);
  border-bottom: 1px solid var(--rule);
}
.match-progress-fill {
  height: 100%;
  background: #22c55e;
  transition: width .4s ease;
}

/* ── Card grid ─────────────────────────────────────────────── */
.grid-wrap { padding: 20px 24px; }

.card-grid {
  display: grid;
  gap: 8px;
  perspective: 1200px;
}
.card-grid.g6  { grid-template-columns: repeat(4, 1fr); }
.card-grid.g9  { grid-template-columns: repeat(6, 1fr); }
.card-grid.g12 { grid-template-columns: repeat(6, 1fr); }

.card {
  aspect-ratio: 3/4;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.card.flipped { transform: rotateY(180deg); }
.card.matched { pointer-events: none; }
.card.shake { animation: cshake .35s; }
@keyframes cshake {
  0%,100% { transform: rotateY(180deg) translateX(0); }
  25%      { transform: rotateY(180deg) translateX(-5px); }
  75%      { transform: rotateY(180deg) translateX(5px); }
}
/* Matched checkmark overlay — shown on top of the flipped front face */
.card.matched::after {
  content: '✓';
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  font-weight: 700;
  color: #22c55e;
  background: rgba(34,197,94,.15);
  border: 2.5px solid #22c55e;
  transform: rotateY(180deg);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
[data-theme="dark"] .card.matched::after {
  background: rgba(34,197,94,.12);
  border-color: #16a34a;
  color: #4ade80;
}

.card-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  text-align: center;
  padding: 6px;
}
.card-back {
  background: var(--faint);
  border: 1.5px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.8rem;
  color: var(--rule);
  user-select: none;
}
.card-back::after { content: '漢'; }
.card-front {
  background: var(--ground);
  border: 1.5px solid var(--ink);
  transform: rotateY(180deg);
  flex-direction: column;
  gap: 4px;
}
.card-front.kj .cf-main {
  font-family: var(--serif);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 700;
  line-height: 1;
  color: var(--ink);
}
.card-front.mn .cf-main {
  font-size: clamp(.65rem, 1.5vw, .9rem);
  line-height: 1.35;
  color: var(--mid);
  font-weight: 600;
}
.cf-tag {
  font-size: .6rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--accent);
  font-weight: 700;
}
/* matched state handled by .card.matched::after overlay */

/* ── Result ─────────────────────────────────────────────────── */
.result-wrap { padding: 32px 24px; }
.result-panel {
  border: 1.5px solid var(--ink);
  text-align: center;
}
.result-top {
  padding: 40px 32px 24px;
  border-bottom: 1.5px solid var(--ink);
  background: var(--faint);
}
.result-icon  { font-size: 3.5rem; margin-bottom: 10px; }
.result-title { font-family: var(--serif); font-size: 1.9rem; font-weight: 700; margin-bottom: 6px; }
.result-sub   { color: var(--mid); font-size: 14px; }
.best-pill {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 14px;
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1.5px solid var(--ink);
}
.rs { padding: 20px; border-right: 1px solid var(--rule); text-align: left; }
.rs:last-child { border-right: none; }
.rs-num   { font-family: var(--serif); font-size: 2rem; font-weight: 700; }
.rs-label { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--mid); margin-top: 4px; }
.result-actions { padding: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 620px) {
  .card-grid.g9, .card-grid.g12 { grid-template-columns: repeat(4, 1fr); }
  .result-stats { grid-template-columns: 1fr 1fr; }
  .card-front.kj .cf-main { font-size: 1.4rem; }
  .game-hud, .grid-wrap, .start-wrap, .result-wrap { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div id="ju-nav"></div>

<header class="page-header">
  <div class="breadcrumb">
    <a href="/">Home</a>
    <span class="sep">›</span>
    <a href="/games/">Games</a>
    <span class="sep">›</span>
    Memory Match
  </div>
  <h1 class="page-h1">Memory Match <span class="h1-jp">記憶マッチ</span></h1>
  <div class="page-meta">
    <span class="meta-pill">Kanji Pairs</span>
    <span class="meta-pill">3 Grid Sizes</span>
    <span class="meta-pill">Best Time Saved</span>
  </div>
</header>

<div class="game-shell">

  <!-- START -->
  <section class="game-screen active" id="screen-start">
    <div class="start-wrap">

      <div class="option-row">
        <div class="option-label">Match Type</div>
        <div class="option-chips" id="type-chips">
          <button class="opt-chip active" onclick="setType('reading', this)">
            <span class="oc-main">読み</span>
            <span class="oc-sub">Kanji → Reading</span>
            <span class="oc-desc">Match each kanji to its hiragana reading</span>
          </button>
          <button class="opt-chip" onclick="setType('meaning', this)">
            <span class="oc-main">意味</span>
            <span class="oc-sub">Kanji → Meaning</span>
            <span class="oc-desc">Match each kanji to its English meaning</span>
          </button>
        </div>
      </div>

      <div class="option-row">
        <div class="option-label">Grid Size</div>
        <div class="option-chips" id="size-chips">
          <button class="opt-chip active" onclick="setSize(6, this)">
            <span class="oc-main">6</span>
            <span class="oc-sub">Pairs · 4×3</span>
            <span class="oc-desc">Quick, 12 cards</span>
          </button>
          <button class="opt-chip" onclick="setSize(9, this)">
            <span class="oc-main">9</span>
            <span class="oc-sub">Pairs · 6×3</span>
            <span class="oc-desc">Standard, 18 cards</span>
          </button>
          <button class="opt-chip" onclick="setSize(12, this)">
            <span class="oc-main">12</span>
            <span class="oc-sub">Pairs · 6×4</span>
            <span class="oc-desc">Full, 24 cards</span>
          </button>
        </div>
      </div>

      <button class="btn btn-solid" onclick="startGame()">Play</button>

    </div>
  </section>

  <!-- GAME -->
  <section class="game-screen" id="screen-game">
    <div class="game-hud">
      <div class="hud-chip">Moves <strong id="hud-moves">0</strong></div>
      <div class="hud-chip">Matched <strong id="hud-matched">0</strong> / <strong id="hud-total">6</strong></div>
      <div class="hud-chip" id="best-chip" style="display:none">Best <strong id="hud-best">—</strong></div>
      <div class="hud-timer" id="hud-timer">0:00</div>
    </div>
    <div class="match-progress-wrap">
      <div class="match-progress-fill" id="match-progress" style="width:0%"></div>
    </div>
    <div class="grid-wrap">
      <div class="card-grid g6" id="card-grid"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="game-screen" id="screen-result">
    <div class="result-wrap">
      <div class="result-panel">
        <div class="result-top">
          
          <div class="result-title">Complete!</div>
          <div class="result-sub" id="r-sub"></div>
          <div id="best-badge" class="best-pill" style="display:none">New Best!</div>
        </div>
        <div class="result-stats">
          <div class="rs"><div class="rs-num" id="r-time">—</div><div class="rs-label">Time</div></div>
          <div class="rs"><div class="rs-num" id="r-moves">—</div><div class="rs-label">Moves</div></div>
          <div class="rs"><div class="rs-num" id="r-score">—</div><div class="rs-label">Score</div></div>
        </div>
        <div class="result-actions">
          <button class="btn btn-solid" onclick="startGame()">Play Again</button>
          <button class="btn btn-ghost" onclick="showScreen('screen-start')">Change Mode</button>
        </div>
      </div>
    </div>
  </section>

</div>

<div id="ju-footer"></div>
<script src="../../nav.js"></script>
<script>
// [kanji, reading, meaning, level]
const DATA = [
  ['日','にち','Sun / Day','N5'],['月','つき','Moon / Month','N5'],['火','ひ','Fire','N5'],
  ['水','みず','Water','N5'],['木','き','Tree','N5'],['金','きん','Gold / Money','N5'],
  ['土','つち','Earth','N5'],['山','やま','Mountain','N5'],['川','かわ','River','N5'],
  ['田','た','Rice Field','N5'],['人','ひと','Person','N5'],['口','くち','Mouth','N5'],
  ['手','て','Hand','N5'],['目','め','Eye','N5'],['耳','みみ','Ear','N5'],
  ['足','あし','Foot / Leg','N5'],['本','ほん','Book','N5'],['大','おお','Big','N5'],
  ['小','ちい','Small','N5'],['中','なか','Inside','N5'],['上','うえ','Above','N5'],
  ['下','した','Below','N5'],['右','みぎ','Right','N5'],['左','ひだり','Left','N5'],
  ['年','とし','Year','N5'],['時','とき','Time','N5'],['花','はな','Flower','N5'],
  ['空','そら','Sky','N5'],['雨','あめ','Rain','N5'],['車','くるま','Car','N5'],
  ['食','た','Eat','N4'],['行','い','Go','N4'],['来','く','Come','N4'],
  ['見','み','See','N4'],['聞','き','Listen','N4'],['話','はな','Speak','N4'],
  ['読','よ','Read','N4'],['書','か','Write','N4'],['知','し','Know','N4'],
  ['帰','かえ','Return','N4'],['感','かん','Feel','N3'],['決','き','Decide','N3'],
  ['続','つづ','Continue','N3'],['終','お','End','N3'],['変','か','Change','N3'],
];

let pairSize = 6, matchType = 'reading';
let gs = {};

function setType(t, el) {
  matchType = t;
  document.querySelectorAll('#type-chips .opt-chip').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
function setSize(n, el) {
  pairSize = n;
  document.querySelectorAll('#size-chips .opt-chip').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function startGame() {
  const src  = shuffle([...DATA]).slice(0, pairSize);
  const cards = [];
  src.forEach((d, i) => {
    cards.push({ id: i*2,   pairId: i, role: 'kj', kanji: d[0], reading: d[1], meaning: d[2], level: d[3] });
    cards.push({ id: i*2+1, pairId: i, role: 'mn', kanji: d[0], reading: d[1], meaning: d[2], level: d[3] });
  });
  shuffle(cards);

  gs = {
    cards, moves: 0, matched: new Set(),
    flipped: [], locked: false, pairSize,
    startTime: Date.now(), timerInterval: null,
  };

  clearInterval(gs.timerInterval);
  gs.timerInterval = setInterval(tick, 500);

  document.getElementById('hud-moves').textContent   = '0';
  document.getElementById('hud-matched').textContent = '0';
  document.getElementById('hud-total').textContent   = pairSize;
  document.getElementById('hud-timer').textContent   = '0:00';
  document.getElementById('match-progress').style.width = '0%';

  const bk = bestKey();
  const bv = localStorage.getItem(bk);
  if (bv) {
    document.getElementById('hud-best').textContent = fmtTime(+bv);
    document.getElementById('best-chip').style.display = '';
  } else {
    document.getElementById('best-chip').style.display = 'none';
  }

  renderGrid(cards);
  showScreen('screen-game');
}

function renderGrid(cards) {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  grid.className = 'card-grid g' + pairSize;

  cards.forEach(card => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = card.id;

    const back  = document.createElement('div');
    back.className = 'card-face card-back';

    const front = document.createElement('div');
    if (card.role === 'kj') {
      front.className = 'card-face card-front kj';
      front.innerHTML = `<div class="cf-main">${card.kanji}</div>`;
    } else {
      front.className = 'card-face card-front mn';
      const txt = matchType === 'reading' ? card.reading : card.meaning;
      front.innerHTML = `<div class="cf-main">${txt}</div><div class="cf-tag">${card.level}</div>`;
    }

    el.appendChild(back);
    el.appendChild(front);
    el.addEventListener('click', () => flip(card.id, el));
    grid.appendChild(el);
  });
}

function flip(cardId, el) {
  if (gs.locked) return;
  if (gs.flipped.includes(cardId)) return;
  const card = gs.cards.find(c => c.id === cardId);
  if (gs.matched.has(card.pairId)) return;

  el.classList.add('flipped');
  speak(card.kanji);
  gs.flipped.push(cardId);

  if (gs.flipped.length === 2) {
    gs.locked = true;
    gs.moves++;
    document.getElementById('hud-moves').textContent = gs.moves;
    checkPair();
  }
}

function checkPair() {
  const [a, b] = gs.flipped.map(id => gs.cards.find(c => c.id === id));
  if (a.pairId === b.pairId) {
    gs.matched.add(a.pairId);
    document.getElementById('hud-matched').textContent = gs.matched.size;
    document.getElementById('match-progress').style.width = (gs.matched.size / gs.pairSize * 100) + '%';

    document.querySelectorAll(`[data-id="${a.id}"], [data-id="${b.id}"]`).forEach(e => e.classList.add('matched'));
    gs.flipped = [];
    gs.locked  = false;

    if (gs.matched.size === gs.pairSize) setTimeout(endGame, 350);
  } else {
    setTimeout(() => {
      document.querySelectorAll(`[data-id="${a.id}"], [data-id="${b.id}"]`).forEach(e => {
        e.classList.add('shake');
        setTimeout(() => e.classList.remove('flipped', 'shake'), 350);
      });
      gs.flipped = [];
      gs.locked  = false;
    }, 750);
  }
}

function tick() {
  const s = Math.floor((Date.now() - gs.startTime) / 1000);
  document.getElementById('hud-timer').textContent = fmtTime(s);
}

function endGame() {
  clearInterval(gs.timerInterval);
  const elapsed = Math.floor((Date.now() - gs.startTime) / 1000);
  const score   = Math.max(0, 1000 - gs.moves * 15 - elapsed * 2 + pairSize * 20);
  const grade   = score >= 800 ? '完璧！' : score >= 600 ? '素晴らしい！' : score >= 400 ? '良い' : 'もう一度';

  document.getElementById('r-sub').textContent   = `${grade} — ${pairSize} pairs cleared in ${fmtTime(elapsed)}`;
  document.getElementById('r-time').textContent  = fmtTime(elapsed);
  document.getElementById('r-moves').textContent = gs.moves;
  document.getElementById('r-score').textContent = score;

  const bk   = bestKey();
  const prev = localStorage.getItem(bk);
  const badge = document.getElementById('best-badge');
  if (!prev || elapsed < +prev) {
    localStorage.setItem(bk, elapsed);
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
  showScreen('screen-result');
}

function bestKey() { return `match-${pairSize}-${matchType}`; }
function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function showScreen(id) {
  document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
