<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation Practice — Japanese Uncovered</title>
<meta name="description" content="Practice real Japanese conversations in four everyday scenarios: convenience store, izakaya, asking directions, and checking into a hotel. Type your Japanese and get instant feedback.">
<link rel="stylesheet" href="../../style.css">
<style>
.tool-shell { max-width: 800px; margin: 0 auto; padding: 0 0 60px; }

/* ── Scenario selector ──────────────────────────────────────── */
.scenario-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0;
  border: 1.5px solid var(--ink);
}
@media (max-width: 520px) { .scenario-grid { grid-template-columns: 1fr; } }
.scen-card {
  padding: 22px 24px;
  border: none;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  background: var(--ground);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  transition: background .14s;
}
.scen-card:nth-child(even) { border-right: none; }
.scen-card:nth-last-child(-n+2) { border-bottom: none; }
.scen-card:hover, .scen-card:focus { background: var(--faint); outline: none; }
.scen-title { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.scen-jp { font-size: .95rem; color: var(--mid); font-family: var(--serif); margin-bottom: 10px; }
.scen-desc { font-size: 13px; color: var(--mid); line-height: 1.55; }
.scen-turns { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mid); margin-top: 10px; }

/* ── Conversation area ──────────────────────────────────────── */
.conv-wrap { display: none; }
.conv-header {
  padding: 14px 22px;
  border: 1.5px solid var(--ink);
  border-bottom: none;
  background: var(--faint);
  display: flex;
  gap: 12px;
  align-items: center;
}
.conv-emoji-big { font-size: 1.6rem; }
.conv-heading { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; }
.conv-sub { font-size: 12px; color: var(--mid); }
.back-btn {
  margin-left: auto;
  font-size: 12px; font-weight: 700;
  border: 1px solid var(--rule); padding: 5px 12px;
  background: none; cursor: pointer; color: var(--mid);
}
.back-btn:hover { color: var(--ink); }

.conv-progress-bar {
  height: 3px; background: var(--rule);
  border-left: 1.5px solid var(--ink);
  border-right: 1.5px solid var(--ink);
}
.conv-progress-fill { height: 100%; background: var(--ink); transition: width .3s ease; width: 0%; }

/* ── Dialogue feed ──────────────────────────────────────────── */
.conv-feed {
  border: 1.5px solid var(--ink);
  border-top: none;
  border-bottom: none;
  min-height: 320px;
  max-height: 420px;
  overflow-y: auto;
  padding: 0;
}

.msg {
  display: flex;
  gap: 12px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--rule);
}
.msg:last-child { border-bottom: none; }
.msg.npc { background: var(--faint); }
.msg.user { background: var(--ground); }
.msg.sys { background: var(--faint2); border-left: 3px solid var(--accent); padding-left: 19px; }
.msg.success-msg { background: #f0fdf4; border-left: 3px solid #22c55e; padding-left: 19px; }
.msg.fail-msg { background: #fff7f5; border-left: 3px solid var(--accent); padding-left: 19px; }
[data-theme="dark"] .msg.success-msg { background: #1a3520; }
[data-theme="dark"] .msg.fail-msg { background: #2a1510; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0; background: var(--faint2);
}
.msg-body { flex: 1; }
.msg-sender { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); margin-bottom: 4px; }
.msg-jp { font-family: var(--serif); font-size: 1.05rem; line-height: 1.65; }
.msg-en { font-size: 12px; color: var(--mid); margin-top: 3px; }
.msg-tip { font-size: 13px; color: var(--mid); line-height: 1.6; }

.speak-btn {
  font-size: 13px; margin-top: 6px;
  padding: 3px 9px; border: 1px solid var(--rule);
  background: none; cursor: pointer; color: var(--mid);
}
.speak-btn:hover { color: var(--ink); }

/* ── Input area ─────────────────────────────────────────────── */
.conv-input-box {
  border: 1.5px solid var(--ink);
  border-top: 1px solid var(--rule);
  padding: 18px 22px;
}
.conv-task { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.conv-hint { font-size: 12px; color: var(--mid); margin-bottom: 10px; line-height: 1.55; }
.conv-kw-hint {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
}
.kw-hint-chip {
  font-size: 12px; padding: 3px 8px;
  border: 1px solid var(--rule); color: var(--mid);
  cursor: pointer; transition: border-color .12s, color .12s;
  font-family: var(--serif);
}
.kw-hint-chip:hover { border-color: var(--ink); color: var(--ink); }
.kw-hint-chip.used { text-decoration: line-through; opacity: .45; }
.conv-ta {
  width: 100%; min-height: 60px; padding: 10px;
  border: 1.5px solid var(--ink); background: var(--ground);
  color: var(--ink); font-size: 14px; resize: vertical;
  line-height: 1.65; font-family: var(--serif); transition: border-color .15s;
}
.conv-ta:focus { outline: none; border-color: var(--accent); }
.conv-ta::placeholder { color: var(--mid); }
.conv-btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* ── Tip reveal ─────────────────────────────────────────────── */
.tip-row { margin-top: 8px; }
.tip-toggle {
  font-size: 12px; color: var(--mid); cursor: pointer;
  background: none; border: none; padding: 0; text-decoration: underline;
}
.tip-box { display: none; margin-top: 8px; padding: 10px 12px; background: var(--faint); border-left: 2px solid var(--mid); font-size: 13px; color: var(--mid); line-height: 1.6; }

/* ── Done screen ────────────────────────────────────────────── */
.done-screen {
  display: none;
  border: 1.5px solid var(--ink);
  padding: 40px 32px;
  text-align: center;
}
.done-title { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
.done-sub { font-size: 14px; color: var(--mid); margin-bottom: 24px; }
.done-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 28px; }
.done-stat span { display: block; }
.done-stat .n { font-family: var(--serif); font-size: 2rem; font-weight: 700; }
.done-stat .l { font-size: 11px; color: var(--mid); text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>

let currentScen = null;
let turnIdx     = 0;
let correct     = 0;
let total       = 0;

function speak(text, rate = 0.82) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = rate;
  window.speechSynthesis.speak(u);
}

function buildScenGrid() {
  const grid = document.getElementById('scen-grid');
  grid.innerHTML = SCENARIOS.map((s, i) =>
    `<button class="scen-card" onclick="startScen(${i})">
      <div class="scen-title">${s.title}</div>
      <div class="scen-jp">${s.titleJp}</div>
      <div class="scen-desc">${s.desc}</div>
      <div class="scen-turns">${s.turns.length} exchanges</div>
    </button>`
  ).join('');
}

function startScen(idx) {
  currentScen = SCENARIOS[idx];
  turnIdx = 0; correct = 0; total = 0;

  document.getElementById('scen-picker').style.display = 'none';
  const wrap = document.getElementById('conv-wrap');
  wrap.style.display = 'block';
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('conv-feed').style.display = '';
  document.getElementById('conv-input-box').style.display = '';

  document.getElementById('conv-header').innerHTML = `
    <div>
      <div class="conv-heading">${currentScen.title} — ${currentScen.titleJp}</div>
      <div class="conv-sub">${currentScen.turns.length} exchanges to complete</div>
    </div>
    <button class="back-btn" onclick="backToMenu()">← Scenarios</button>`;

  document.getElementById('conv-feed').innerHTML = '';
  renderTurn();
}

function backToMenu() {
  window.speechSynthesis.cancel();
  document.getElementById('scen-picker').style.display = '';
  document.getElementById('conv-wrap').style.display = 'none';
}

function renderTurn() {
  if (turnIdx >= currentScen.turns.length) {
    showDone(); return;
  }
  const t = currentScen.turns[turnIdx];
  updateProgress();
  appendMsg('npc', currentScen.emoji, 'Staff', t.npc, t.npcEn, true);
  renderInputBox(t);
  scrollFeed();
}

function appendMsg(type, avatar, sender, jp, en, speakIt) {
  const feed = document.getElementById('conv-feed');
  const div  = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `
    <div class="msg-body">
      <div class="msg-sender">${sender}</div>
      <div class="msg-jp">${jp}</div>
      ${en ? `<div class="msg-en">${en}</div>` : ''}
      ${speakIt ? `<button class="speak-btn" onclick="speak('${jp.replace(/'/g,"\\'")}')">▶ Listen</button>` : ''}
    </div>`;
  feed.appendChild(div);
  if (speakIt) speak(jp);
}

function appendSysMsg(type, text) {
  const feed = document.getElementById('conv-feed');
  const div  = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `<div class="msg-body"><div class="msg-tip">${text}</div></div>`;
  feed.appendChild(div);
}

function renderInputBox(t) {
  const box = document.getElementById('conv-input-box');
  const kws = t.keywords;
  box.innerHTML = `
    <div class="conv-task">${t.userTask}</div>
    <div class="conv-hint">Hint vocabulary (click to insert):</div>
    <div class="conv-kw-hint" id="kw-hint-row">
      ${kws.map(k => `<span class="kw-hint-chip" onclick="insertKw(this,'${k.replace(/'/g,"\\'")}',true)">${k}</span>`).join('')}
    </div>
    <textarea class="conv-ta" id="conv-ta" rows="2" placeholder="Type your Japanese here…"></textarea>
    <div class="tip-row">
      <button class="tip-toggle" onclick="toggleTip(this)">Show example phrase</button>
      <div class="tip-box">${t.tip}</div>
    </div>
    <div class="conv-btn-row">
      <button class="btn btn-solid" onclick="submitTurn()">Send →</button>
      <button class="btn btn-ghost" onclick="skipTurn()">Skip</button>
    </div>`;
}

function insertKw(el, kw, markUsed) {
  const ta = document.getElementById('conv-ta');
  if (!ta) return;
  const start = ta.selectionStart; const end = ta.selectionEnd;
  const text = ta.value;
  ta.value = text.slice(0, start) + kw + text.slice(end);
  ta.selectionStart = ta.selectionEnd = start + kw.length;
  ta.focus();
  if (markUsed) el.classList.add('used');
}

function toggleTip(btn) {
  const box = btn.nextElementSibling;
  const open = box.style.display === 'block';
  box.style.display = open ? 'none' : 'block';
  btn.textContent = open ? 'Show example phrase' : 'Hide example';
}

function submitTurn() {
  const ta   = document.getElementById('conv-ta');
  const text = (ta?.value || '').trim();
  if (!text) return;

  const t   = currentScen.turns[turnIdx];
  const hit = t.keywords.some(k => text.includes(k));

  total++;
  appendMsg('user', '', 'You', text, '', false);
  speak(text);

  if (hit) {
    correct++;
    appendMsg('npc success-msg', currentScen.emoji, 'Staff', t.successNpc, t.successNpcEn, true);
    appendSysMsg('success-msg', '✓ Good match on key vocabulary!');
  } else {
    appendMsg('npc fail-msg', currentScen.emoji, 'Staff', t.failNpc, t.failNpcEn, true);
    appendSysMsg('fail-msg', `✗ Missing key words — try: <strong>${t.keywords.slice(0,3).join('、')}</strong>`);
  }

  turnIdx++;
  updateProgress();
  scrollFeed();

  if (turnIdx >= currentScen.turns.length) {
    document.getElementById('conv-input-box').innerHTML = `<div style="padding:8px 0;text-align:center"><button class="btn btn-solid" onclick="showDone()">See Results →</button></div>`;
  } else {
    setTimeout(() => { renderTurn(); }, 900);
  }
}

function skipTurn() {
  const t = currentScen.turns[turnIdx];
  total++;
  appendSysMsg('sys', `⏭ Skipped — example: <em>${t.tip}</em>`);
  turnIdx++;
  updateProgress();
  scrollFeed();
  if (turnIdx >= currentScen.turns.length) {
    showDone();
  } else {
    setTimeout(() => { renderTurn(); }, 400);
  }
}

function updateProgress() {
  const pct = currentScen ? (turnIdx / currentScen.turns.length * 100) : 0;
  document.getElementById('conv-progress').style.width = pct + '%';
}

function scrollFeed() {
  const feed = document.getElementById('conv-feed');
  setTimeout(() => { feed.scrollTop = feed.scrollHeight; }, 50);
}

function showDone() {
  document.getElementById('conv-feed').style.display = 'none';
  document.getElementById('conv-input-box').style.display = 'none';
  document.getElementById('conv-progress').style.width = '100%';

  const pct = total ? Math.round(correct / total * 100) : 0;
  
  const msg   = pct >= 70 ? '素晴らしい！ Great conversation!' : pct >= 40 ? 'まあまあ — keep practicing' : 'Keep studying — try again!';

  document.getElementById('done-screen').style.display = '';
  document.getElementById('done-screen').innerHTML = `
    <div class="done-title">${msg}</div>
    <div class="done-sub">${currentScen.title} — ${currentScen.titleJp}</div>
    <div class="done-stats">
      <div class="done-stat"><span class="n" style="color:#22c55e">${correct}</span><span class="l">Correct</span></div>
      <div class="done-stat"><span class="n">${total}</span><span class="l">Exchanges</span></div>
      <div class="done-stat"><span class="n">${pct}%</span><span class="l">Score</span></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-solid" onclick="startScen(${SCENARIOS.indexOf(currentScen)})">Try Again</button>
      <button class="btn btn-ghost" onclick="backToMenu()">All Scenarios</button>
    </div>`;
}

buildScenGrid();
</script>
</body>
</html>
